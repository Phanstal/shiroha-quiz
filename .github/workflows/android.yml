name: Build APK

on:
  push:
    branches: [FUFUQuiz]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x apps/android/gradlew

      - name: Build APK
        working-directory: apps/android
        env:
          CAT_SIGNING_B64: ${{ secrets.FUFU_CAT_SIGNING_B64 }}
          CAT_SIGNING_PASSWORD: ${{ secrets.FUFU_CAT_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export CAT_SIGNING_FILE="$RUNNER_TEMP/cat-release.p12"
          trap 'rm -f "$CAT_SIGNING_FILE"' EXIT
          printf '%s' "${CAT_SIGNING_B64:?Missing signing secret}" | base64 --decode > "$CAT_SIGNING_FILE"
          ./gradlew --no-daemon assembleNativeRelease

      - name: Collect APK
        run: |
          mkdir -p out
          find apps/android/app/build/outputs -name '*.apk' -print
          cp apps/android/app/build/outputs/apk/native/release/app-native-release.apk \
             out/FUFUQuiz-v1.1.1.apk
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUFUQuiz-apk
          path: out/FUFUQuiz-v1.1.1.apk
          if-no-files-found: error
          retention-days: 30
